services:
  - type: web
    name: shadowhunt-server
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGINS
        value: "https://shadowhunt-rho.vercel.app,http://localhost:5173,http://127.0.0.1:5173"
